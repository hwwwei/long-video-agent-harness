name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit and API tests
        run: mvn -B -ntp verify
      - name: Check browser script syntax
        run: node --check src/main/resources/static/dashboard.js
  compose-smoke:
    runs-on: ubuntu-latest
    needs: java-tests
    steps:
      - uses: actions/checkout@v4
      - name: Start full stack
        run: docker compose up -d --build
      - name: Wait for API
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q '"UP"'; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Real video and transcript smoke
        run: python3 scripts/video_smoke.py
      - name: Capture the actual Compose dashboard
        run: |
          mkdir -p docs/screenshots
          npx --yes playwright@1.55.0 install chromium
          npx --yes playwright@1.55.0 screenshot --full-page --wait-for-timeout=1500 http://127.0.0.1:8080/ docs/screenshots/dashboard-compose.png
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-compose-screenshot
          path: docs/screenshots/dashboard-compose.png
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v
